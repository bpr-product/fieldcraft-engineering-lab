[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldcraft-engineering-lab"
version = "0.1.0"
description = "Independent synthetic showcase of integration, data, and applied AI engineering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.25,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
